name: Alpha Release

# Build and publish the alpha APK as a GitHub Release asset when a version tag is
# pushed (e.g. v6.7.1-alpha01). The APK is produced on the runner and attached to
# the release server-side, so it is a direct one-click .apk download.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish alpha APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing (if secrets present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Signing with provided release keystore."
          else
            echo "No keystore secret; using debug-key fallback (still connects via the pinned trusted-client digest)."
          fi

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Stage APK with a friendly name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/AIO-Streamer-${GITHUB_REF_NAME}.apk"
          ls -la dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/AIO-Streamer-${GITHUB_REF_NAME}.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --prerelease \
            --title "AIO Streamer ${GITHUB_REF_NAME}" \
            --notes "Automated alpha build (universal APK: minSdk 24 → target 35, all ABIs/densities, phone + TV). Connects to the v9 backend as the trusted client via the pinned signing digest. Sideload: enable 'Install unknown apps' and open the .apk."
