name: Alpha Release

# Build and publish the alpha APK as a GitHub Release asset. Triggers on a v* tag
# push, or via manual/API dispatch with a `tag` input (the job then creates that
# tag at the checked-out commit through `gh release create`). The APK is produced
# and attached server-side, so it is a direct one-click .apk download.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v6.7.1-alpha01)"
        required: true
        default: "v6.7.1-alpha01"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish alpha APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        run: echo "TAG=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing (if secrets present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Signing with provided release keystore."
          else
            echo "No keystore secret; using debug-key fallback (still connects via the pinned trusted-client digest)."
          fi

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Stage APK with a friendly name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/AIO-Streamer-${TAG}.apk"
          ls -la dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" \
            "dist/AIO-Streamer-${TAG}.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "AIO Streamer ${TAG}" \
            --notes "Automated alpha build (universal APK: minSdk 24 → target 35, all ABIs/densities, phone + TV). Connects to the v9 backend as the trusted client via the pinned signing digest. Sideload: enable 'Install unknown apps' and open the .apk."
